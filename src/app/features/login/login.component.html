<main class="login-page">
  <section class="login-card">

    <div class="login-heading">
      <h1>Iniciar sesión</h1>
      <p>Accede al punto de venta</p>
    </div>

    <form
      class="login-form"
      (ngSubmit)="login()"
    >
      <label>
        <span>Usuario</span>

        <input
          id="username"
          type="text"
          name="username"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          autocomplete="username"
          placeholder="Ingresa tu usuario"
          [disabled]="loading()"
          required
        />
      </label>

      <label>
        <span>Contraseña</span>

        <div class="password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña"
            [disabled]="loading()"
            required
          />

          <button
            type="button"
            class="password-toggle"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <!-- Ojo cerrado -->
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.2A10.6 10.6 0 0 1 12 4c5 0 8.5 4 9.5 6-0.4.8-1.3 2.1-2.7 3.3M6.6 6.6C4.5 8 3.2 9.8 2.5 11c1 2 4.5 6 9.5 6 1.5 0 2.8-.3 4-.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            } @else {
              <!-- Ojo abierto -->
              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M2.5 12S6 6 12 6s9.5 6 9.5 6S18 18 12 18 2.5 12 2.5 12Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="2.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            }
          </button>
        </div>
      </label>

      @if (error()) {
        <p class="login-error">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        class="btn btn-primary login-submit"
        [disabled]="loading()"
      >
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
