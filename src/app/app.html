<header class="app-header">

  <div class="app-header-inner">

    <a
      class="brand"
      routerLink="/sales"
      (click)="closeMenu()"
    >

      <div class="brand-mark">
        EJ
      </div>

      <div class="brand-text">
        <strong>
          EL JAIBO
        </strong>

        <span>
          Desconchadero
        </span>

        <small class="app-version">
          v{{ environment.version }}
        </small>
      </div>

    </a>


    @if (authService.isAuthenticated()) {

      <nav
        class="main-nav"
        [class.open]="menuOpen()"
      >

        <a
          routerLink="/sales"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Ventas
        </a>

        <a
          routerLink="/cash"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Caja
        </a>

        <a
          routerLink="/inventory"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Inventario
        </a>

        @if (authService.isAdmin()) {

          <a
            routerLink="/catalog"
            routerLinkActive="active"
          >
            Catálogo
          </a>

          <a
            routerLink="/purchases"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Compras
          </a>

          <a
            routerLink="/suppliers"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Proveedores
          </a>

          <a
            routerLink="/users"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Usuarios
          </a>

        }

        <div class="mobile-nav-actions">

          <button
            type="button"
            class="btn btn-secondary"
            (click)="toggleTheme()"
          >
            {{
              themeService.theme() === 'dark'
                ? 'Tema claro'
                : 'Tema oscuro'
            }}
          </button>

          <button
            type="button"
            class="btn btn-danger"
            (click)="logout()"
          >
            Cerrar sesión
          </button>

        </div>

      </nav>


      <div class="header-actions">

        <button
          type="button"
          class="theme-toggle"
          (click)="toggleTheme()"
          [attr.aria-label]="
            themeService.theme() === 'dark'
              ? 'Cambiar a tema claro'
              : 'Cambiar a tema oscuro'
          "
        >
          @if (themeService.theme() === 'dark') {
            ☀
          } @else {
            ◐
          }
        </button>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          Salir
        </button>

        <button
          type="button"
          class="menu-button"
          (click)="toggleMenu()"
          aria-label="Abrir menú"
        >
          ☰
        </button>

      </div>

    }

  </div>

</header>

<router-outlet />
